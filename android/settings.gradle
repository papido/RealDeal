import groovy.json.JsonSlurper

pluginManagement {
  def reactNativeGradlePlugin = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
    }.standardOutput.asText.get().trim()
  ).getParentFile().absolutePath
  includeBuild(reactNativeGradlePlugin)
  
  def expoPluginsPath = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })")
    }.standardOutput.asText.get().trim(),
    "../android/expo-gradle-plugin"
  ).absolutePath
  includeBuild(expoPluginsPath)
}

plugins {
  id("com.facebook.react.settings")
  id("expo-autolinking-settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
}
expoAutolinking.useExpoModules()

rootProject.name = 'RealDeal'

expoAutolinking.useExpoVersionCatalog()

include ':app'
includeBuild(expoAutolinking.reactNativeGradlePlugin)

// Guard against mis-resolved RN library project directories.
def autolinkingJson = file("build/generated/autolinking/autolinking.json")
if (autolinkingJson.exists()) {
  def autolinking = new JsonSlurper().parse(autolinkingJson)
  autolinking?.dependencies?.each { packageName, dep ->
    def androidConfig = dep?.platforms?.android
    def sourceDir = androidConfig?.sourceDir
    if (!sourceDir) return

    def gradleProjectName = ":" + packageName
      .replace("@", "")
      .replace("/", "_")

    if (findProject(gradleProjectName) != null) {
      project(gradleProjectName).projectDir = file(sourceDir)
    }
  }
}

// Fallback fix: some autolinking setups include package roots instead of their
// Android library module dir. Remap those projects to `<package>/android`.
rootProject.children.each { child ->
  if (child.name == "app") return
  def currentDir = child.projectDir
  def gradleFile = new File(currentDir, "build.gradle")
  def androidGradleFile = new File(currentDir, "android/build.gradle")
  if (!gradleFile.exists() && androidGradleFile.exists()) {
    child.projectDir = new File(currentDir, "android")
  }
}

def mapAndroidModule = { String projectName, String modulePath ->
  if (findProject(projectName) != null) {
    project(projectName).projectDir = file(modulePath)
  }
}

